name: Frontend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PRIMEUI_LICENSE_KEY: ''
      API_BASE_URL: /api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npx --yes --package=npm@12.2.0 npm ci
      - name: Format, boundaries, unit tests and production build
        run: npm run check
      - name: Install pinned Chromium
        run: npx playwright install chromium
      - name: Web desktop and tablet interactions and visual regression
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: frontend-browser-verification
          path: |
            artifacts/playwright-report/
            artifacts/playwright-results/
          retention-days: 7
